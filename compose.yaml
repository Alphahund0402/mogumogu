services:
  checks:
    build:
      context: .
      target: checks
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - cargo-cache:/cache/cargo
      - target-cache:/workspace/target

volumes:
  cargo-cache:
  target-cache:
