[package]
name = "mogumogu"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "Local development inventory and a nature-inspired Windows tray dashboard"
build = "build.rs"
default-run = "mogumogu"
publish = false

[lib]
name = "mogumogu"
path = "src/lib.rs"

[[bin]]
name = "mogumogu"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "mogumogu-cli"
path = "src/bin/cli/main.rs"

[features]
default = ["desktop"]
# Native Slint dashboard and tray. Core tests run without it.
desktop = ["dep:slint", "dep:slint-build", "dep:embed-resource"]

[dependencies]
quick-xml = "0.41"
# Patterns use \w, \s, \d, \b and (?i); no \p{..} classes, so the other Unicode tables stay out.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1"
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "system-tray", "accessibility", "compat-1-18"] }
# Only parsed, never written. Major 1 is the one embed-resource already uses.
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }
# Used only when the target is Windows, also when cross-compiling from Linux.
embed-resource = { version = "=3.0.11", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
# Cargo's defaults of 16 codegen units and no cross-crate LTO. With one unit
# and thin LTO the 14 MB of Rust that Slint generates from ui/ compiled on a
# single core: 287 instead of 113 s after a one-file change. Redraws, scans and
# snapshots stayed within the measured spread, the EXE grew by 1 %
# (docs/MESSBERICHT.md, 1 November 2026).
lto = false
strip = "debuginfo"

# Local iteration: this crate at opt-level 1, incremental, no whole-program link.
[profile.fast]
inherits = "dev"
opt-level = 1
incremental = true
codegen-units = 256
debug = 0
lto = false
# Redraws cost about twice what they cost in release, and only 20 % less with
# dependencies at opt-level 3, which add a minute to the first build: most of
# the work is the generated UI code of this crate. Fine for iteration only.

[profile.dev]
debug = 1
